# Example automation: SMS when the basement leak sensor turns wet.
# Adjust the entity id and the receiver.
alias: SMS on water leak
description: Text me when the basement leak sensor detects water.
mode: single
max_exceeded: silent
triggers:
  - trigger: state
    entity_id: binary_sensor.basement_leak
    to: "on"
actions:
  - action: rest_command.send_sms
    data:
      receiver: "+4915123456789"
      message: "Water leak in the basement ({{ now().strftime('%H:%M') }})"
  # Cooldown: at most one SMS per 30 minutes.
  - delay:
      minutes: 30
